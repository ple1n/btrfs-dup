[package]
name = "btrfs-dup"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
twox-hash = "2.1"
btrfs-uapi = "0.13.0"
lancedb = { version = "0.40.0", features = ["remote"] }
futures = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
debug = 2
strip = "none"
