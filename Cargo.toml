[package]
name = "btrfs-dup"
version = "0.1.0"
edition = "2024"
description = "Scan Btrfs filesystems for duplicate extents and deduplicate them"
license = "MIT"
repository = "https://github.com/ple1n/btrfs-dup"
readme = "README.md"
keywords = ["btrfs", "deduplication", "filesystem", "sqlite"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
twox-hash = "2.1"
btrfs-uapi = "0.13.0"
futures = "0.3"
libc = "0.2"
dioxus = { version = "0.7.3", default-features = false, features = ["desktop", "lib", "launch"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[profile.release]
opt-level = 3
debug = 2
strip = "none"
